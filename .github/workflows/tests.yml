name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit, integration and end-to-end tests
        run: python -m pytest --cov=. --cov-report=term --cov-fail-under=90
      - name: Full pipeline smoke run
        run: python main.py --quick --out ci-results

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Full verification + dashboard (tests, pipeline, mutation testing)
        run: python verify_all.py --no-open
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: results/
